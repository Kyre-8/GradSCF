[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradscf"
version = "1.0.0"
description = "JAX toolkit for differentiable Hartree-Fock and Kohn-Sham SCF, response theory, and Neural XC training."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "GradSCF developers"},
]
dependencies = [
  "jax>=0.4.14",
  "jaxlib>=0.4.14",
  "flax>=0.10.7,<0.11; python_version < '3.11'",
  "flax>=0.12.0; python_version >= '3.11'",
  "jaxtyping>=0.2.36",
  "numpy>=1.24",
  "optax>=0.2.6",
]

[project.urls]
Repository = "https://github.com/STOKES-DOT/GradSCF"

[project.optional-dependencies]
symmetry = ["spglib>=2.0"]
nnao = ["mace_jax @ git+https://github.com/ACEsuit/mace-jax.git@19cf364a405fcf9f2f82590a98d61bc870e05881"]
comparison-tests = ["pytest>=8.0", "pyscf>=2.3.0"]
dev = [
  "pytest>=8.0",
]
upstreams = [
  "jax-xc>=0.0.12",
]
reproducibility = [
  "h5py>=3.8",
  "jax-xc>=0.0.12",
  "matplotlib>=3.7",
  "scipy>=1.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gradscf*"]
exclude = ["gradscf.integrals._native.*", "gradscf.integrals.basis.data.pyscf_basis_snapshot*",
           "gradscf.model.nnao.tests*", "gradscf.model.nnao.vendor*"]

[tool.setuptools.package-data]
"gradscf.model" = ["README.md"]
"gradscf.dft" = ["*.md"]
"gradscf.dfpt" = ["*.md"]
"gradscf.pbc" = ["*.md"]
"gradscf.model.neural_xc.training" = ["*.md"]
"gradscf.ofdft" = ["*.md", "LICENSE.libKEDF"]
"gradscf.fci" = ["*.md", "references.bib"]
"gradscf.mp" = ["*.md"]
"gradscf.cc" = ["LICENSE.pyscf", "*.md", "references.bib"]
"gradscf.model.nnao" = ["data/szp3.json", "data/qvszps/**/*", "NNAO.md", "README.md"]
"gradscf.integrals" = ["*.md"]
"gradscf.integrals.basis.data" = [
  "_pyscf_basis_bundle.json",
  "pyscf_basis_snapshot/**/*",
]
"gradscf.integrals.grids" = ["_lebedev_level*.npz"]
"gradscf.integrals.periodic" = ["gth_data.json", "NOTICE.md"]
"gradscf.integrals._native" = [
  "CMakeLists.txt",
  "README.md",
  "exports.*",
  "csrc/*.cc",
  "csrc/*.h",
  "include/*.h",
  "patches/*.md",
  "vendor/**/*",
]

[tool.setuptools.exclude-package-data]
"gradscf.integrals._native" = ["build/**/*", "lib/*"]
